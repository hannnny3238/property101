<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부동산101 - 대한민국 부동산 NO.1 비교분석 플랫폼</title>
  <!-- 카카오맵 SDK -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=db5075df452a34fedc72515249485561"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 외부 CSS 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 font-sans text-gray-800 antialiased p-3 md:p-8">

  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- 헤더 & 지역 선택 바 -->
    <header class="bg-blue-950 text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-md-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">🏢 부동산101</h1>
        <p class="text-xs text-blue-200 mt-1">대한민국 부동산 NO.1 비교분석 플랫폼</p>
      </div>

      <div class="flex items-center gap-2 bg-blue-900/80 p-2.5 rounded-xl border border-blue-700">
        <label class="text-xs font-semibold text-blue-100 whitespace-nowrap">📍 분석 대상 지역:</label>
        <select id="citySelect" class="bg-blue-950 text-white text-xs border border-blue-600 rounded-lg p-2 focus:outline-none">
          <option value="seoul">서울특별시</option>
        </select>
        <select id="districtSelect" onchange="handleDistrictChange()" class="bg-blue-950 text-white text-xs font-bold border border-yellow-400 rounded-lg p-2 focus:outline-none text-yellow-300">
          <option value="성동구" selected>성동구 (16개 구역 활성)</option>
          <option value="강남구" disabled>강남구 (추후 오픈 예정)</option>
          <option value="용산구" disabled>용산구 (추후 오픈 예정)</option>
        </select>
      </div>
    </header>

    <!-- 메인 레이아웃 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <!-- Left Column: 프로필 입력 -->
      <div class="lg:col-span-4 space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 space-y-4 sticky top-6">
          <div class="border-b pb-3 flex justify-between items-center">
            <h2 class="font-bold text-gray-900 text-lg flex items-center gap-2">
              👤 사용자 맞춤 프로필
            </h2>
            <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2.5 py-0.5 rounded-full">AI 분석 기준</span>
          </div>

          <form id="userProfileForm" class="space-y-3 text-xs">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-semibold text-gray-600 mb-1">나이</label>
                <input type="number" id="userAge" value="38" class="w-full p-2 border rounded-xl focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block font-semibold text-gray-600 mb-1">성별</label>
                <select id="userGender" class="w-full p-2 border rounded-xl">
                  <option value="남성">남성</option>
                  <option value="여성">여성</option>
                </select>
              </div>
            </div>

            <!-- 자본금 & 대출가능액 -->
            <div class="grid grid-cols-2 gap-2 bg-blue-50/60 p-2.5 rounded-xl border border-blue-100">
              <div>
                <label class="block font-semibold text-blue-900 mb-1">투자 자본금(억)</label>
                <input type="number" id="userCapital" value="6" step="0.5" oninput="updateTotalFund()" class="w-full p-2 border border-blue-300 rounded-lg font-bold text-blue-700">
              </div>
              <div>
                <label class="block font-semibold text-indigo-900 mb-1">대출 가능액(억)</label>
                <input type="number" id="userLoan" value="3" step="0.5" oninput="updateTotalFund()" class="w-full p-2 border border-indigo-300 rounded-lg font-bold text-indigo-700">
              </div>
              <div class="col-span-2 text-right pt-1 border-t border-blue-200/60 flex justify-between items-center">
                <span class="text-[11px] text-gray-500">💳 총 가용 자금:</span>
                <span id="totalFundDisplay" class="text-sm font-black text-emerald-600">9.0 억원</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-semibold text-gray-600 mb-1">보유주택 시세(억)</label>
                <input type="number" id="userHouseValue" value="12" step="0.5" class="w-full p-2 border rounded-xl">
              </div>
              <div>
                <label class="block font-semibold text-gray-600 mb-1">주택 수</label>
                <select id="userHouseCount" class="w-full p-2 border rounded-xl">
                  <option value="무주택">무주택</option>
                  <option value="1주택" selected>1주택</option>
                  <option value="2주택 이상">2주택 이상</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-semibold text-gray-600 mb-1">주요 출근지</label>
                <input type="text" id="userWorkplace" value="강남역" class="w-full p-2 border rounded-xl font-bold text-blue-900">
              </div>
              <div>
                <label class="block font-semibold text-gray-600 mb-1">자녀 유무</label>
                <select id="userHasChild" class="w-full p-2 border rounded-xl">
                  <option value="유(초등 이하)">유(초등 이하)</option>
                  <option value="유(중고등 이상)">유(중고등 이상)</option>
                  <option value="무" selected>무</option>
                </select>
              </div>
            </div>

            <!-- 선호 환경 -->
            <div>
              <label class="block font-semibold text-gray-600 mb-1">선호 환경 (중복 선택)</label>
              <div class="grid grid-cols-3 gap-1 text-[11px]">
                <label class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border"><input type="checkbox" name="prefEnv" value="역세권" checked> 역세권</label>
                <label class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border"><input type="checkbox" name="prefEnv" value="한강/호수뷰" checked> 한강/호수</label>
                <label class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border"><input type="checkbox" name="prefEnv" value="공원/숲세권" checked> 공원/숲</label>
                <label class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border"><input type="checkbox" name="prefEnv" value="자전거/러닝길" checked> 러닝/자전거</label>
                <label class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border"><input type="checkbox" name="prefEnv" value="우수학군"> 학군</label>
                <label class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border"><input type="checkbox" name="prefEnv" value="평지"> 평지</label>
              </div>
            </div>

            <button type="button" onclick="runAiComparison()" class="w-full mt-2 bg-gradient-to-r from-blue-700 via-indigo-700 to-blue-900 text-white font-bold text-sm py-3 rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
              <span>🤖 AI 심층 비교분석 실행</span>
            </button>
          </form>
        </div>
      </div>

      <!-- Right Column: 지도 & 구역 선택 목록 -->
      <div class="lg:col-span-8 space-y-6">
        <div class="bg-white p-3.5 rounded-2xl shadow-md border border-slate-200 relative">
          <div class="absolute top-6 left-6 z-10 bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-xl shadow-md border text-xs font-bold text-blue-950 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-600 animate-pulse"></span>
            성동구 정비사업 구역 마스킹 (체크 시 주황색 하이라이트)
          </div>
          <div id="map" style="width: 100%; height: 500px;" class="rounded-xl"></div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 space-y-4">
          <div class="flex justify-between items-center border-b pb-3">
            <h3 class="font-bold text-gray-900 text-base">
              📋 정비사업 구역 선택 (<span id="selectedCount" class="text-blue-600 font-extrabold text-lg">0</span>개 선택됨)
            </h3>
            <div class="space-x-2 text-xs">
              <button onclick="selectAllZones(true)" class="text-blue-600 font-semibold hover:underline">전체선택</button>
              <span class="text-gray-300">|</span>
              <button onclick="selectAllZones(false)" class="text-gray-500 hover:underline">선택해제</button>
            </div>
          </div>

          <div class="max-h-[260px] overflow-y-auto border rounded-xl">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 text-gray-700 sticky top-0">
                <tr>
                  <th class="p-3 w-10 text-center"><input type="checkbox" id="checkAllHeader" onchange="toggleAllCheckboxes(this)"></th>
                  <th class="p-3">구역명</th>
                  <th class="p-3">사업유형</th>
                  <th class="p-3">추진단계</th>
                  <th class="p-3">기존세대</th>
                  <th class="p-3">예정세대</th>
                </tr>
              </thead>
              <tbody id="zoneTableBody" class="divide-y text-gray-600"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- 리포트 섹션 -->
    <section id="analysisReportSection" class="bg-white p-8 rounded-3xl shadow-xl border border-blue-100 space-y-8">
      <div class="border-b pb-5 flex flex-col md:flex-row justify-between md:items-center gap-4">
        <div>
          <div class="inline-flex items-center gap-2 bg-blue-100 text-blue-900 font-extrabold text-xs px-3 py-1 rounded-full mb-2">
            <span>🏢 부동산101 매치 포인트 (Match Point)</span>
          </div>
          <h2 class="text-2xl font-extrabold text-slate-900">구역별 상세 비교 분석 리포트</h2>
          <p class="text-xs text-gray-500 mt-1">선택하신 정비구역의 핵심 지표와 사용자 맞춤 입지 조건, 자금 충족도를 정밀 대조한 결과입니다.</p>
        </div>
        <div id="selectedBadges" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="overflow-x-auto">
        <table id="detailedCompareTable" class="w-full border-collapse text-sm text-center"></table>
      </div>

      <div id="aiSummaryCard" class="bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 text-white p-6 md:p-8 rounded-2xl shadow-lg border border-blue-800 space-y-4"></div>
    </section>

  </div>

  <!-- 외부 JavaScript 연결 -->
  <script src="app.js"></script>
</body>
</html>
